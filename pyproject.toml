[project]
name = "ffs"
version = "0.1.0"
description = "FencingFastStats — FIE competition analytics"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "pyarrow",
    "requests",
    "beautifulsoup4",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ffs = "ffs.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
