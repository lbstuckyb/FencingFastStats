<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FencingFastStats</title>
<meta name="description" content="Analytics for FIE international fencing: ratings, results and head-to-head records from 2002 onward.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="#/">Fencing<span>Fast</span>Stats</a>
    <nav class="site-nav">
      <a href="#/" data-nav="home">Home</a>
      <a href="#/search" data-nav="search">Fencers</a>
    </nav>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch colour theme">
      <span aria-hidden="true">◐</span>
    </button>
  </div>
</header>

<main id="main" class="wrap"></main>

<footer class="site-footer">
  <div class="wrap">
    <p>
      Data scraped from public <a href="https://fie.org" rel="noopener">fie.org</a> competition archives.
      Ratings and metrics are computed by this project and are not official FIE figures.
    </p>
    <p id="footer-meta" class="muted"></p>
  </div>
</footer>

<script type="module" src="js/app.js"></script>

</html>
